name: Publish PEP Magazine

on:
  schedule:
    - cron: '*/15 16-23 * * 6'   # Saturday 17:00 to midnight Lagos time
    - cron: '*/30 * * * 0'       # all day Sunday
    - cron: '17 */3 * * 1-5'     # every 3 hours on weekdays (late approvals, corrections)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==10.4.0
      - name: Get approved issue
        id: pub
        run: python tools/publish.py
      - name: Make print edition
        if: steps.pub.outputs.changed == 'true'
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
          python tools/print_pdf.py "${{ steps.pub.outputs.date }}"
      - name: Save to repository
        if: steps.pub.outputs.changed == 'true'
        run: |
          git config user.name "PEP publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A data assets print
          git commit -m "Publish issue ${{ steps.pub.outputs.date }}"
          git push
      - uses: actions/configure-pages@v5
        if: steps.pub.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pub.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        if: steps.pub.outputs.changed == 'true' || github.event_name != 'schedule'
