name: Print-shop PDF

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Sunday date (YYYY-MM-DD)'
        required: true
      code:
        description: 'One-time code from the PEP Google script'
        required: true

concurrency:
  group: printshop-${{ inputs.date }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ghostscript qpdf
          pip install pillow==10.4.0 pikepdf==9.4.2 pymupdf==1.24.14 playwright==1.47.0 fonttools==4.54.1
          python -m playwright install --with-deps chromium
      - name: Build and send to Drive
        run: python printshop/run.py "${{ inputs.date }}" "${{ inputs.code }}"
