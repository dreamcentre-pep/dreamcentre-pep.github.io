<script>
const DATA=window.DATA;const S=DATA.site,I=DATA.issue,M=DATA.month||{};const ACC=DATA.accent;

function page(){PG=document.createElement('section');PG.className='page';root.appendChild(PG);return PG}
/* absolutely placed element; y given as BASELINE of first line unless top:true */

/* text box (multi-line) with first baseline at y */

const over=e=>e.scrollHeight>e.clientHeight+1;
/* ---- flow blocks through several boxes ---- */
function flow(boxes,blocks,note){
  boxes.forEach(b=>b.innerHTML='');let i=0,carry=null;
  for(let k=0;k<boxes.length;k++){const bx=boxes[k];
    while(true){
      let blk=carry||blocks[i];if(!blk)break;
      const node=mk(blk);bx.appendChild(node);
      if(!over(bx)){carry=null;i++;continue}
      /* split by words */
      bx.removeChild(node);

      const w=words(blk.text);let lo=0,hi=w.length-1;
      while(lo<hi){const m=Math.ceil((lo+hi)/2);const n=mk(Object.assign({},blk,{text:w.slice(0,m).join(' '),cut:true}));bx.appendChild(n);const ok=!over(bx);bx.removeChild(n);if(ok)lo=m;else hi=m-1}
      if(lo>0){bx.appendChild(mk(Object.assign({},blk,{text:w.slice(0,lo).join(' '),cut:true})));carry=Object.assign({},blk,{text:w.slice(lo).join(' '),cont:true,drop:false})}
      else carry=blk;

function mk(b){const e=document.createElement(b.tag||'p');if(b.cls)e.className=b.cls;

/* fit: largest size in [lo,hi] where flow leaves nothing; then optionally stretch line spacing */
function fitFlow(boxes,blocks,lo,hi,lhRatio,stretchMax){

  let a=lo,b=hi;for(let k=0;k<12;k++){const m=(a+b)/2;set(m);if(flow(boxes,blocks))b=m;else a=m}
  set(a);const left=flow(boxes,blocks);if(!left&&stretchMax)stretch(boxes,blocks,a,lhRatio,stretchMax);return left?null:a}
function stretch(boxes,blocks,s,r0,r1){let a=r0,b=r1;const set=r=>boxes.forEach(x=>x.style.lineHeight=pt(s*r));
  set(r1);if(!flow(boxes,blocks))return;for(let k=0;k<10;k++){const m=(a+b)/2;set(m);if(flow(boxes,blocks))b=m;else a=m}set(a);flow(boxes,blocks)}
/* fixed size flow; if it does not fit, end the last box with the note */
function flowCut(boxes,blocks,note){
  let left=flow(boxes,blocks);if(!left)return;
  const last=boxes[boxes.length-1];const nb={text:note,cls:'note',atomic:true};
  /* remove content from the end of the last box until the note fits */
  while(true){const n=mk(nb);last.appendChild(n);if(!over(last))return;last.removeChild(n);
    const lc=last.lastElementChild;if(!lc)return;
    const t=lc.textContent;const w=words(t);
    if(w.length<=4||lc.tagName==='H4'){lc.remove();continue}
    /* trim to previous sentence end if possible, else drop 3 words */
    let cut=w.slice(0,-3).join(' ');const m=cut.match(/^(.*[.!?”"])\s/);if(m&&m[1].length>cut.length*0.6)cut=m[1];else cut=cut.replace(/[,;:\-–]+$/,'')+'...';
    lc.textContent=cut;lc.style.textAlignLast='left';
  }
}
/* ---------------- PAGE 1 ---------------- */
function p1(){page();

  if(l2)line(tc(l2),'tra',41.1,cx,(l1?150.9:150.9),{color:DATA.titleColor||'#000',anchor:'center',maxw:300,minsize:20});

  });
  /* Father's Heart */

    line(t1.join(' '),'mon',10,207.9,373.1,{anchor:'center',maxw:320,minsize:7,group:'fh'});if(t2.length)line(t2.join(' '),'mon',10,207.9,385.1,{anchor:'center',maxw:320,minsize:7,group:'fh'})}
  const bl=[];if(fh.salutation)bl.push({text:fh.salutation});(fh.paragraphs||[]).forEach(p=>bl.push({text:p}));

  const b1=box('txt','',21.1,398.2,195.8,812.8-398.2,8.2,10.9),b2=box('txt','',227.4,398.2,210.7,698-398.2,8.2,10.9);
  FLOWS.push(()=>{[b1,b2].forEach(setBoxTop);fitFlow([b1,b2],bl,6.6,11,1.33,1.6);[b1,b2].forEach(setBoxTop);flow([b1,b2],bl)});
  /* quote with diagonal left edge */

    q.innerHTML=`<div style="float:left;width:30pt;height:100%;shape-outside:polygon(0 0,0% 0,100% 100%,0 100%)"></div>${esc(fh.quote)}`;
    FLOWS.push(()=>{setBoxTop(q);let s=10;while(over(q)&&s>5.5){s-=.25;q.style.fontSize=pt(s);q.style.lineHeight=pt(s*1.18)}});}

/* ---------------- PAGE 2: God's Word ---------------- */
function p2(){const w=M.word;page();const d=D(I.date);const mn=MONTHS[d.getMonth()].toUpperCase();

/* ---------------- PAGE 3 ---------------- */
function p3(){page();const hy=I.hymn||{},s=I.study||{},g=I.greaterWorks||{},c=I.covenant||{};

  const tw=words(String(s.title||'').toUpperCase());const t2=tw.length>=3?tw.slice(-2).join(' '):tw.join(' '),t1=tw.length>=3?tw.slice(0,-2).join(' '):'';

  if(s.number)line(String(s.number),'monb',17.2,48.1,197.3,{anchor:'center',color:'#000',maxw:26,minsize:9});

  const blocks=(s.blocks||[]).slice();let ci=blocks.findIndex(b=>b.callout);let call=ci>=0?blocks.splice(ci,1)[0].callout:'';

    else if(b.scripture)bl.push({text:b.scripture,cls:'scr'});

  const sb=[box('txt','',28.6,232.6,170,637-232.6,7.9,11.5),box('txt','',213.7,232.6,170.1,649-232.6,7.9,11.5),box('txt','',398.9,232.6,170,500-232.6,7.9,11.5)];

/* ---------------- PAGE 4 ---------------- */
function p4(){page();const by=I.bibleInYear||[];const v=I.vocabulary||{},pw=I.propheticWords||[],t=I.testimony||{};

  FLOWS.push(()=>{setBoxTop(ib);let z=8;while(over(ib)&&z>5){z-=.2;ib.style.fontSize=pt(z);ib.style.lineHeight=pt(z*1.16)}});

  /* testimony */

  const sig=[t.author,t.zone].filter(Boolean).join('\n');if(sig)bl.push({text:sig,cls:'sig',gap:true});

}
