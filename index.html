<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/fixed/logo.webp">
<title>PEP Magazine</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: an iOS-style reader. Sidebar + single reading column on desktop, sticky header + bottom tab bar on phones.
   The weekly accent comes from the issue data (picked from that week's background image). */
:root{
  --accent:#fec91b;            /* overwritten per issue */
  --accent-text:var(--accent-text-light,#8a6a00); /* accent darkened for text on light surfaces */
  --on-accent:#1a1406;         /* readable ink on top of accent */
  --bg:#f3f3f1;
  --surface:#ffffff;
  --surface-2:#ebebe8;
  --fg:#17171a;
  --muted:#6a6a70;
  --line:rgba(20,20,30,.10);
  --scrim:rgba(10,10,14,.62);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --font-display:"Cinzel","Trajan Pro",Georgia,serif;
  --font-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:18px;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0e10;--surface:#1b1b1f;--surface-2:#26262b;--fg:#f2f1ee;--muted:#a2a2a9;--line:rgba(255,255,255,.10);
  --accent-text:var(--accent-text-dark,#ffd95e);--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e10;--surface:#1b1b1f;--surface-2:#26262b;--fg:#f2f1ee;--muted:#a2a2a9;--line:rgba(255,255,255,.10);
  --accent-text:var(--accent-text-dark,#ffd95e);--shadow:none;color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}
.logo{width:34px;height:27px;flex:none;background:var(--fg);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.brand-txt{min-width:0;line-height:1.15}
.brand-name{font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .date-chip{margin-left:auto}
.date-chip{font-size:12px;font-weight:700;letter-spacing:.04em;padding:6px 10px;border-radius:99px;background:var(--accent);color:var(--on-accent);white-space:nowrap;font-variant-numeric:tabular-nums}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom,0px));min-width:0}
.view{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.view.wide{max-width:980px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tabbar-h);text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] .ico{background:var(--accent);color:var(--on-accent)}
.ico{display:grid;place-items:center;width:44px;height:28px;border-radius:99px;transition:background .2s}

@media (min-width:900px){
  .shell{grid-template-columns:272px 1fr}
  .top,.tabbar{display:none}
  body::before{display:none}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto;
    padding:28px 18px;border-right:1px solid var(--line);background:var(--surface)}
  .side .logo{width:56px;height:44px}
  .side .brand{flex-direction:column;align-items:flex-start;gap:12px}
  .side .brand-name{font-size:15px}
  .side .brand-sub{white-space:normal}
  .side .date-chip{align-self:flex-start}
  main{padding-block:40px 64px;padding-left:48px;padding-right:48px}
}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 12px 6px}
.nav-link{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:600;font-size:15px}
.nav-link svg{width:20px;height:20px;color:var(--muted);flex:none}
.nav-link:hover{background:var(--surface-2)}
.nav-link[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.nav-link[aria-current="page"] svg{color:var(--on-accent)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* ---------- shared pieces ---------- */
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
.page-head{display:flex;flex-direction:column;gap:8px}
.page-title{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,6vw,42px);line-height:1.08;letter-spacing:.01em}
.page-sub{color:var(--muted);font-size:15px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:20px}
@media (min-width:600px){.pad{padding:28px}}
.read{font-family:var(--font-read);font-size:18.5px;line-height:1.68;display:flex;flex-direction:column;gap:1em;max-width:66ch}
.read .lead{font-size:21px;line-height:1.55}
.read .lead::first-letter{font-family:var(--font-display);font-weight:700;float:left;font-size:3.3em;line-height:.82;padding:6px 10px 0 0;color:var(--accent-text)}
.read h3{font-family:var(--font-ui);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:.6em;color:var(--fg)}
.read ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:.3em}
.scripture{border-radius:14px;background:var(--surface-2);padding:16px 18px;font-style:italic}
.scripture cite{display:block;font-style:normal;font-family:var(--font-ui);font-size:13px;font-weight:800;letter-spacing:.06em;margin-top:8px;color:var(--accent-text)}
.callout{font-family:var(--font-ui);font-weight:800;font-size:17px;line-height:1.45;padding:16px 18px;border-radius:14px;background:var(--accent);color:var(--on-accent)}
.sig{font-family:var(--font-read);font-style:italic;white-space:pre-line;color:var(--muted)}
.img-cover{width:100%;height:100%;object-fit:cover;display:block}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:700;font-size:14px;border:0;cursor:pointer}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- today / cover ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;min-height:340px;display:flex;align-items:flex-end;isolation:isolate;background:#222}
.hero .bg{position:absolute;inset:0;z-index:-2}
.hero .pastors{position:absolute;right:50%;transform:translateX(50%);bottom:150px;height:56%;max-width:70%;object-fit:contain;object-position:bottom right;z-index:-1;filter:drop-shadow(0 10px 30px rgba(0,0,0,.25))}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 45%,rgba(8,8,10,.92) 72%,rgba(8,8,10,.96) 100%)}
.hero{min-height:460px}
.hero-txt{padding:22px;color:#fff;display:flex;flex-direction:column;gap:6px;max-width:100%}
.hero-date{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero-title{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,7vw,52px);line-height:1.02}
.hero-who{font-size:14px;font-weight:600;opacity:.9}
@media (min-width:600px){.hero{min-height:420px}.hero .pastors{right:-2%;transform:none;bottom:0;height:88%}.hero::after{background:linear-gradient(90deg,rgba(8,8,10,.72) 0%,rgba(8,8,10,.25) 55%,transparent 75%)}.hero-txt{padding:36px;max-width:58%;align-self:center}}

.month-strip{display:flex;flex-direction:column;gap:12px}
.month-strip .t{font-weight:700}
.sundays{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sun{border-radius:12px;padding:10px 8px;text-align:center;background:var(--surface-2);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.sun b{display:block;font-size:20px;color:var(--fg);letter-spacing:0}
.sun.now{background:var(--accent);color:var(--on-accent)}
.sun.now b{color:var(--on-accent)}

.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.tile{display:flex;flex-direction:column;gap:8px;text-decoration:none;padding:20px;min-width:0;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile h3{font-family:var(--font-display);font-size:21px;line-height:1.2}
.tile p{color:var(--muted);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .more{margin-top:auto;font-size:13px;font-weight:700;color:var(--accent-text)}
.tile.span{grid-column:1/-1}
.tile.img{position:relative;overflow:hidden;color:#fff;min-height:200px;justify-content:flex-end;isolation:isolate;border:0}
.tile.img img{position:absolute;inset:0;z-index:-2}
.tile.img::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.72))}
.tile.img p{color:rgba(255,255,255,.88)}
.tile.img .eyebrow,.tile.img .more{color:var(--accent)}

/* ---------- heart ---------- */
.pull{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end;overflow:hidden;padding:20px 20px 0}
.pull img{width:96px;align-self:end;display:block}
.pull q{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.35;quotes:none;padding-bottom:20px;align-self:center}
.side-by{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.side-by{grid-template-columns:1fr 1fr}}
.feature{display:flex;gap:16px;align-items:center;padding:18px;min-width:0}
.feature img{width:92px;border-radius:8px;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.feature h3{font-family:var(--font-display);font-size:17px;line-height:1.25}
.feature p{font-size:13.5px;color:var(--muted)}

/* ---------- study / month banners ---------- */
.banner{position:relative;border-radius:22px;overflow:hidden;min-height:220px;display:flex;align-items:flex-end;isolation:isolate;color:#fff}
.banner>img{position:absolute;inset:0;z-index:-2}
.banner::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.75))}
.banner .in{padding:22px;display:flex;flex-direction:column;gap:6px}
.banner .page-title{color:#fff}
.banner .eyebrow{color:var(--accent)}
.study-no{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#fff;color:#111;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.month-wrap{display:grid;grid-template-columns:1fr;gap:20px}
.month-portrait{display:none}
@media (min-width:1100px){.month-wrap{grid-template-columns:220px 1fr}.month-portrait{display:block;position:sticky;top:40px;align-self:start}.month-portrait img{width:100%;border-radius:18px;background:var(--surface-2)}}

/* ---------- daily ---------- */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;padding:10px 0;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:center;cursor:pointer;font-variant-numeric:tabular-nums}
.day small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day b{font-size:20px}
.day[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.day[aria-pressed="true"] small{color:var(--on-accent)}
.readings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reading{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0}
.reading small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.today-tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--fg);color:var(--bg);padding:3px 8px;border-radius:99px}
.vocab{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vocab li{padding:12px 0;border-top:1px solid var(--line);font-weight:600;display:flex;gap:12px}
.vocab li:first-child{border-top:0}
.vocab li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:9px}
.words{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.word{border-radius:14px;padding:16px 12px;text-align:center;font-weight:800;font-size:14px;letter-spacing:.05em;text-transform:uppercase;background:var(--fg);color:var(--bg);display:grid;place-items:center;min-height:72px}
@media (min-width:640px){.words{grid-template-columns:repeat(3,1fr)}}

/* ---------- worship ---------- */
.gw{position:relative;overflow:hidden;border-radius:22px;isolation:isolate;color:#fff;background:#111}
.gw img{position:absolute;inset:0;z-index:-2;opacity:.85}
.gw::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,.8))}
.gw .in{padding:26px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;text-align:right;min-height:240px;justify-content:flex-end}
.gw .ref{font-weight:800;letter-spacing:.06em}
.gw blockquote{margin:0;font-weight:800;font-size:clamp(18px,3.6vw,24px);line-height:1.35;color:var(--accent);max-width:30ch}
.cov{position:relative;overflow:hidden;border-radius:22px;isolation:isolate;color:#fff;background:#140d06;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;padding:24px}
.cov img{position:absolute;inset:0;z-index:-2}
.cov::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.1) 50%,rgba(0,0,0,.6))}
.cov .big{font-weight:800;font-size:clamp(30px,7vw,44px);line-height:.98;text-transform:uppercase;letter-spacing:-.01em}
.cov .line{font-family:var(--font-read);font-style:italic;align-self:flex-end}
.hymn{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:center;overflow:hidden}
.hymn img{width:110px;height:100%;min-height:110px;object-fit:cover;display:block}
.hymn .t{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.2}
.hymn .in{padding:16px 16px 16px 0;min-width:0}

/* ---------- more ---------- */
.list{display:flex;flex-direction:column}
.list a,.list .li{display:flex;align-items:center;gap:14px;padding:14px 18px;text-decoration:none;border-top:1px solid var(--line);font-weight:600;min-width:0}
.list>:first-child{border-top:0}
.list .chev{margin-left:auto;color:var(--muted);flex:none;width:18px;height:18px}
.list .meta{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
.list svg.lead{width:22px;height:22px;color:var(--accent-text);flex:none}
details.region{border-top:1px solid var(--line)}
details.region:first-of-type{border-top:0}
details.region summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;display:flex;align-items:center}
details.region summary::-webkit-details-marker{display:none}
details.region summary .meta{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
details.region ul{margin:0;padding:0 18px 14px 36px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;color:var(--muted)}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.books figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.books img{border-radius:10px;background:#f4f4f4;aspect-ratio:7/9;object-fit:contain;width:100%}
.books figcaption{font-size:12.5px;font-weight:600;line-height:1.3}
.order{display:flex;gap:16px;align-items:center}
.order img{width:84px;height:84px;border-radius:10px;background:#fff;padding:4px;flex:none}
.order .copy{font-size:14px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.order b{color:var(--fg)}
.prog{display:flex;flex-direction:column;gap:6px}
.prog h3{font-family:var(--font-display);font-size:20px;line-height:1.25}

.preview-bar{position:sticky;top:0;z-index:40;background:#b3261e;color:#fff;font-weight:700;font-size:13px;text-align:center;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;align-items:center}
.preview-bar[hidden]{display:none}
.pb-btn{background:#fff;color:#b3261e;padding:7px 14px;border-radius:99px;text-decoration:none}
.pb-link{color:#fff;opacity:.9}
.print-mode .side,.print-mode .top,.print-mode .tabbar,.print-mode .preview-bar{display:none!important}
.print-mode .shell{grid-template-columns:1fr!important}
.print-mode main{padding:0 24px!important}
.print-page{break-after:page;padding-block:20px}
.print-mode .card{box-shadow:none}
.print-mode .tile p{-webkit-line-clamp:unset}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="previewBar" class="preview-bar" hidden>Preview only. This issue is waiting for approval and is not public yet.</div>
<div class="shell">
  <aside class="side" aria-label="Sections">
    <a class="brand" href="#today"><span class="logo" aria-hidden="true"></span>
      <span class="brand-txt"><span class="brand-name">PEP Magazine</span><br><span class="brand-sub" data-bind="churchLine"></span></span></a>
    <span class="date-chip" data-bind="dateShort"></span>
    <nav id="sideNav"></nav>
    <div class="side-foot"><span data-bind="motto"></span><a data-bind="website" target="_blank" rel="noopener"></a></div>
  </aside>
  <header class="top">
    <a class="brand" href="#today"><span class="logo" aria-hidden="true"></span>
      <span class="brand-txt"><span class="brand-name">PEP Magazine</span><br><span class="brand-sub">The Dream Centre</span></span></a>
    <span class="date-chip" data-bind="dateShort"></span>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>

<script>
(function(){
const ICONS={
  today:'<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',

/* --- accent maths: readable text/ink from the weekly accent --- */
function hexToHsl(h){h=h.replace('#','');const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let H=0,S=0,L=(mx+mn)/2;if(mx!==mn){const d=mx-mn;S=L>.5?d/(2-mx-mn):d/(mx+mn);
  H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H*=60}return [H,S*100,L*100]}
const hsl=(h,s,l)=>`hsl(${h.toFixed(0)} ${s.toFixed(0)}% ${l.toFixed(0)}%)`;
function lum(h){h=h.replace('#','');return [0,2,4].map(i=>{let c=parseInt(h.slice(i,i+2),16)/255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)}).reduce((a,c,i)=>a+c*[.2126,.7152,.0722][i],0)}
function applyAccent(hex){
  const [h,s]=hexToHsl(hex);const r=document.documentElement.style;
  r.setProperty('--accent',hex);
  r.setProperty('--accent-text-light',hsl(h,Math.min(s,85),30));
  r.setProperty('--accent-text-dark',hsl(h,Math.min(s,90),68));
  r.setProperty('--on-accent',lum(hex)>.4?hsl(h,40,10):'#ffffff');
}

/* weekly accent picked from the cover image when none is given */
function accentFromImage(img){
  if(!img)return;const run=()=>{try{
    const c=document.createElement('canvas'),w=60,h=Math.max(1,Math.round(60*img.naturalHeight/img.naturalWidth));c.width=w;c.height=h;
    const x=c.getContext('2d');x.drawImage(img,0,0,w,h);const d=x.getImageData(0,0,w,h).data,bins={};
    for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx<90||mx-mn<60)continue;
      const [hh]=hexToHsl('#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''));const k=Math.round(hh/15);(bins[k]=bins[k]||[]).push([r,g,b])}
    const best=Object.values(bins).sort((a,b)=>b.length-a.length)[0];if(!best||best.length<20)return;
    const avg=[0,1,2].map(j=>Math.round(best.reduce((s,p)=>s+p[j],0)/best.length));
    let [hh,ss,ll]=hexToHsl('#'+avg.map(v=>v.toString(16).padStart(2,'0')).join(''));ll=Math.min(Math.max(ll,45),62);ss=Math.max(ss,55);
    I.accent=hslHex(hh,ss,ll);applyAccent(I.accent);
  }catch(e){}};
  if(img.complete&&img.naturalWidth)run();else img.addEventListener('load',run,{once:true});
}
function hslHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return '#'+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('')}

  const pb=document.getElementById('previewBar');
  if(I.preview){pb.hidden=false;pb.innerHTML=I.preview.status==='Draft'?
      `Preview. Not public yet. <a class="pb-btn" target="_top" href="${esc(I.preview.approve)}">Approve this issue</a>${I.preview.swap.map(s=>` <a class="pb-link" target="_top" href="${esc(s.url)}">New ${s.slot} image</a>`).join('')}`:
      `Preview. This issue is approved (${esc(I.preview.status)}).`}
  else pb.hidden=I.status==='approved';
  const binds={dateShort:shortDate(I.date)+' '+D(I.date).getFullYear(),churchLine:`${S.church} ${S.churchFull}`,motto:S.motto};
  document.querySelectorAll('[data-bind]').forEach(el=>{const k=el.dataset.bind;
    if(k==='website'){el.textContent=S.website.label;el.href=S.website.url}else el.textContent=binds[k]});
  if(new URLSearchParams(location.search).get('print')){renderPrint();return}
  document.getElementById('sideNav').innerHTML=`<div class="nav-group"><span class="nav-label">This issue</span>${NAV.map(n=>`<a class="nav-link" data-nav="${n.id}" href="#${n.id}">${ic(n.id)}${esc(n.label)}</a>`).join('')}</div>`;
  document.getElementById('tabbar').innerHTML=NAV.filter(n=>n.tab).map(n=>`<a class="tab" data-nav="${n.id}" href="#${n.id}"><span class="ico">${ic(n.id)}</span>${n.tab}</a>`).join('');
  window.addEventListener('hashchange',route);route();
}

if(window.PEP_DATA)boot(window.PEP_DATA);
else if(new URLSearchParams(location.search).get('preview')){
  let done=false;
  window.addEventListener('message',e=>{const d=e.data;if(done||!d||!d.pepPreview)return;done=true;window.PEP_ASSETS=d.assets||{};boot(d)});
  try{parent.postMessage('pep-ready','*')}catch(e){}
}
else{
  const q=new URLSearchParams(location.search).get('issue');
  const url=q&&/^\d{4}-\d{2}-\d{2}$/.test(q)?`data/issues/${q}.json`:'data/current.json';
  fetch(url,{cache:'no-store'}).then(r=>r.json()).then(boot)
  .catch(()=>{document.getElementById('main').innerHTML='<div class="view"><p>This week\'s magazine could not load. Check your connection and refresh.</p></div>'});
}
})();
</script>

</body>
</html>
